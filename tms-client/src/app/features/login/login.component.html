<section class="login-shell">
  <div class="login-card">
    <h1>Welcome back</h1>
    <p>Sign in to continue to TMS</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        <span>Username</span>
        <input type="text" formControlName="username" autocomplete="username" placeholder="Enter username" />
      </label>

      <label>
        <span>Password</span>
        <input type="password" formControlName="password" autocomplete="current-password" placeholder="Enter password" />
      </label>

      @if (errorMessage) {
        <div class="error-message">{{ errorMessage }}</div>
      }

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? "Signing in..." : "Sign in" }}
      </button>
    </form>
  </div>
</section>
