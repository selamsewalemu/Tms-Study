<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TMS Core</title>

    <!-- ── Responsive viewport ───────────────────────────────────── -->
    <meta name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1,
               maximum-scale=5, viewport-fit=cover" />

    <!-- ── PWA / Android home-screen ────────────────────────────── -->
    <meta name="theme-color" content="#020817" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="TMS Core" />

    <!-- ── iOS Safari home-screen ───────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TMS Core" />

    <!-- ── SEO / Open Graph ──────────────────────────────────────── -->
    <meta name="description"
      content="TMS Core — Training Management System. Manage courses, enrollments and student registrations." />
    <meta property="og:title"       content="TMS Core" />
    <meta property="og:description" content="Training Management System" />
    <meta property="og:type"        content="website" />

    <!-- ── Manifest ──────────────────────────────────────────────── -->
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- ── Icons ─────────────────────────────────────────────────── -->
    <link rel="icon"             type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />

    <!-- ── Prevent flash of unstyled content ─────────────────────── -->
    <style>
      html, body { margin: 0; padding: 0; background: #020817; }
    </style>
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      <div style="padding:2rem;color:#f1f5f9;font-family:sans-serif;text-align:center;background:#020817">
        TMS Core requires JavaScript. Please enable it in your browser settings.
      </div>
    </noscript>
  </body>
</html>
